services:
  postgres:
    image: postgres:16
    container_name: etl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: erp
      TZ: America/Sao_Paulo
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d erp"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  dw-setup:
    image: postgres:16
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: erp
    volumes:
      - ./initdb:/initdb:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ -z "$$(psql -tAc "select to_regclass('dw.fato_movimento_estoque')")" ]; then
          echo "Criando schema dw..."
          psql -v ON_ERROR_STOP=1 -f /initdb/02_dw_estoque.sql
        else
          echo "Schema dw ja existe, nada a fazer"
        fi
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: etl_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

  hop:
    image: apache/hop-web:latest
    container_name: etl_hop
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "${HOP_PORT:-8080}:8080"
    volumes:
      - ./hop/etl-estoque:/usr/local/tomcat/webapps/ROOT/config/projects/default
    depends_on:
      - postgres

volumes:
  pgdata:
